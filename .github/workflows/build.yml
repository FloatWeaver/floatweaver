name: Build and Test Matrix

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        # Every valid (os, compiler, vectorize) combination is listed
        # directly, rather than built from a cross product pruned down with
        # exclude: — each host only supports one arch-appropriate
        # compiler/backend pairing (x86 hosts: SSE/AVX/AVX2/AVX512; arm64
        # hosts: NEON; only x64 Linux also gets emcc), so a full cross
        # product needed far more exclude rules than valid combinations.
        # Adding a new host, compiler, or backend is just adding rows here.
        include:
          # ubuntu-latest (x64)
          - { os: ubuntu-latest, c_compiler: gcc-12,   cxx_compiler: g++-12,     vectorize: Generic,   build_type: Release }
          - { os: ubuntu-latest, c_compiler: gcc-12,   cxx_compiler: g++-12,     vectorize: 'SSE 4.2', build_type: Release }
          - { os: ubuntu-latest, c_compiler: gcc-12,   cxx_compiler: g++-12,     vectorize: AVX,       build_type: Release }
          - { os: ubuntu-latest, c_compiler: gcc-12,   cxx_compiler: g++-12,     vectorize: 'AVX 2',   build_type: Release }
          - { os: ubuntu-latest, c_compiler: gcc-12,   cxx_compiler: g++-12,     vectorize: 'AVX 512', build_type: Release }
          - { os: ubuntu-latest, c_compiler: clang-18, cxx_compiler: clang++-18, vectorize: Generic,   build_type: Release }
          - { os: ubuntu-latest, c_compiler: clang-18, cxx_compiler: clang++-18, vectorize: 'SSE 4.2', build_type: Release }
          - { os: ubuntu-latest, c_compiler: clang-18, cxx_compiler: clang++-18, vectorize: AVX,       build_type: Release }
          - { os: ubuntu-latest, c_compiler: clang-18, cxx_compiler: clang++-18, vectorize: 'AVX 2',   build_type: Release }
          - { os: ubuntu-latest, c_compiler: clang-18, cxx_compiler: clang++-18, vectorize: 'AVX 512', build_type: Release }
          # Emscripten's headers only emulate up to SSE 4.2 over wasm32
          # SIMD128; no __m256/__m512 to target AVX/AVX2/AVX512 with.
          - { os: ubuntu-latest, c_compiler: emcc, vectorize: Generic,   build_type: Release }
          - { os: ubuntu-latest, c_compiler: emcc, vectorize: 'SSE 4.2', build_type: Release }

          # windows-latest (x64)
          - { os: windows-latest, c_compiler: cl, vectorize: Generic,   build_type: Release }
          - { os: windows-latest, c_compiler: cl, vectorize: 'SSE 4.2', build_type: Release }
          - { os: windows-latest, c_compiler: cl, vectorize: AVX,       build_type: Release }
          - { os: windows-latest, c_compiler: cl, vectorize: 'AVX 2',   build_type: Release }
          - { os: windows-latest, c_compiler: cl, vectorize: 'AVX 512', build_type: Release }

          # ubuntu-22.04-arm (native GitHub-hosted arm64 runner). Uses
          # clang-15, not clang-18: that's what's actually preinstalled on
          # this image, unlike its x64 counterpart.
          - { os: ubuntu-22.04-arm, c_compiler: gcc-12,   cxx_compiler: g++-12,     vectorize: Generic, build_type: Release }
          - { os: ubuntu-22.04-arm, c_compiler: gcc-12,   cxx_compiler: g++-12,     vectorize: NEON,    build_type: Release }
          - { os: ubuntu-22.04-arm, c_compiler: clang-15, cxx_compiler: clang++-15, vectorize: Generic, build_type: Release }
          - { os: ubuntu-22.04-arm, c_compiler: clang-15, cxx_compiler: clang++-15, vectorize: NEON,    build_type: Release }

          # windows-11-arm (native GitHub-hosted arm64 runner)
          - { os: windows-11-arm, c_compiler: cl, vectorize: Generic, build_type: Release }
          - { os: windows-11-arm, c_compiler: cl, vectorize: NEON,    build_type: Release }

          # macos-26 (native GitHub-hosted Apple Silicon runner). Xcode's
          # clang isn't a versioned llvm.org build like clang-18/clang-15,
          # so it gets its own unversioned c_compiler value.
          - { os: macos-26, c_compiler: clang, cxx_compiler: clang++, vectorize: Generic, build_type: Release }
          - { os: macos-26, c_compiler: clang, cxx_compiler: clang++, vectorize: NEON,    build_type: Release }

    steps:
      - uses: actions/checkout@v3

      - name: Setup build toolchain configuration
        # Every non-MSVC, non-emcc leg (gcc-12/clang-18/clang) sets cxx_compiler
        # via its include entry above; cl and emcc don't need CC/CXX overridden.
        if: "${{ matrix.cxx_compiler != '' }}"
        run: |
          echo "CC=${{ matrix.c_compiler }}" >> $GITHUB_ENV
          echo "CXX=${{ matrix.cxx_compiler }}" >> $GITHUB_ENV

      - name: Set reusable strings
        # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "generators-dir=${{ github.workspace }}/build/build/generators" >> $GITHUB_OUTPUT
          else
            echo "generators-dir=${{ github.workspace }}/build/build/${{ matrix.build_type }}/generators" >> $GITHUB_OUTPUT
          fi
          if [ "${{ matrix.c_compiler }}" = "emcc" ]; then
            echo "host-profile=-pr:h ${{ github.workspace }}/cmake-conan/emscripten_profile" >> $GITHUB_OUTPUT
          else
            echo "host-profile=" >> $GITHUB_OUTPUT
          fi
          # ubuntu-latest runners don't guarantee AVX-512 CPU support. When
          # this specific runner's CPU lacks it, fall back to running tests
          # under Intel SDE (a dynamic binary instrumentation-based emulator,
          # unlike QEMU's TCG it's built by Intel specifically to emulate
          # exact Intel microarchitectures, including newer ISA extensions on
          # hardware that predates them). When the runner does have real
          # AVX-512 hardware, this is left empty and the tests just run
          # natively (faster, and exercises the actual CPU).
          #
          # QEMU's qemu-x86_64 user-mode TCG emulator was tried first, since
          # this workflow already uses it for the armv7 cross job, but its
          # AVX-512 instruction coverage turned out to be too incomplete for
          # this codebase's actual instruction mix: most tests segfaulted
          # under it (inconsistently — some passed, most didn't — pointing at
          # gaps in specific instruction forms rather than a config mistake).
          if [ "$RUNNER_OS" = "Linux" ] && [ "${{ matrix.vectorize }}" = "AVX 512" ] \
             && ! (grep -qE '\bavx512f\b' /proc/cpuinfo && grep -qE '\bavx512vl\b' /proc/cpuinfo && grep -qE '\bavx512dq\b' /proc/cpuinfo); then
            echo 'avx512-emulator-arg=-DCMAKE_CROSSCOMPILING_EMULATOR="${{ github.workspace }}/sde/sde64;-skx;--"' >> "$GITHUB_OUTPUT"
          else
            echo "avx512-emulator-arg=" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Intel SDE (AVX-512 emulation)
        if: "${{ runner.os == 'Linux' && matrix.vectorize == 'AVX 512' && steps.strings.outputs.avx512-emulator-arg != '' }}"
        # Downloads Intel's Software Development Emulator (a free-to-use,
        # proprietary tool; see Intel's SDE license) and pins it to a known
        # version/checksum rather than trusting whatever "latest" resolves to.
        # -skx targets Skylake-X, the first mainstream Intel microarchitecture
        # with AVX-512F/CD/BW/DQ/VL, matching what this project actually needs.
        run: |
          curl -sL -o sde.tar.xz "https://downloadmirror.intel.com/924984/sde-external-10.13.1-2026-07-28-lin.tar.xz"
          echo "94e97d623fec54385686e1e7ba65ebc9941748c05ee451423948334892bf2b50  sde.tar.xz" | sha256sum -c -
          mkdir -p sde
          tar -xf sde.tar.xz -C sde --strip-components=1

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Install Conan2
        run: pip install conan

      - name: Cache Conan dependencies
        id: conan-cache
        uses: actions/cache@v3
        with:
          path: ~/.conan2
          # Keyed on matrix.os rather than runner.os: ubuntu-latest and
          # ubuntu-22.04-arm both report runner.os Linux but build
          # architecture-specific binaries, so runner.os alone would collide
          # x64 and arm64 caches under the same gcc-12/clang-18 compiler name.
          key: conan2-${{ matrix.os }}-${{ matrix.c_compiler }}-${{ hashFiles('**/conanfile.*') }}
          restore-keys: conan2-${{ matrix.os }}-${{ matrix.c_compiler }}-

      - name: Detect default Conan profile
        if: steps.conan-cache.outputs.cache-hit != 'true'
        run: |
          echo Using C compiler: $CC
          echo Using C++ compiler: $CXX
          conan profile detect

      - name: Install Conan Dependencies
        run: >
          conan install --build=missing ${{ steps.strings.outputs.host-profile }} -of ${{ steps.strings.outputs.build-output-dir }} ${{ github.workspace }}

      - name: Configure CMake
        # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
        # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
        run: >
          cmake -S ${{ github.workspace }}
          -B ${{ steps.strings.outputs.build-output-dir }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_TOOLCHAIN_FILE=${{ steps.strings.outputs.generators-dir }}/conan_toolchain.cmake
          -DWEAVER_VECTORIZE="${{ matrix.vectorize }}"
          ${{ steps.strings.outputs.avx512-emulator-arg }}

      - name: Build
        # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

      - name: Test (Linux/macOS)
        if: "${{ (runner.os == 'Linux' || runner.os == 'macOS') && matrix.c_compiler != 'emcc' }}"
        working-directory: ${{ steps.strings.outputs.build-output-dir }}
        # Execute tests defined by the CMake configuration. Note that --build-config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
        # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
        #
        # No special-casing needed here for AVX-512: Configure CMake already
        # set CMAKE_CROSSCOMPILING_EMULATOR to route through Intel SDE
        # whenever this runner's CPU doesn't natively support it, and left it
        # empty (native execution) otherwise.
        run: ctest --build-config ${{ matrix.build_type }}

      - name: Test (Windows)
        if: "${{ runner.os == 'Windows' }}"
        working-directory: ${{ steps.strings.outputs.build-output-dir }}
        shell: pwsh
        # Windows-latest runners don't guarantee AVX-512 CPU support either,
        # but unlike the Linux leg above this one isn't routed through an
        # emulator, so it still skips rather than failing on an unrelated
        # SIGILL/illegal instruction if the runner's CPU lacks it. Checked via
        # the .NET intrinsics support flag instead of /proc/cpuinfo.
        run: |
          if ("${{ matrix.vectorize }}" -eq "AVX 512") {
            if (-not [System.Runtime.Intrinsics.X86.Avx512F]::IsSupported) {
              Write-Host "::warning::Skipping AVX-512 tests: this runner's CPU does not support AVX-512."
              exit 0
            }
          }
          ctest --build-config ${{ matrix.build_type }}
          exit $LASTEXITCODE

      - name: Test (Emscripten)
        if: "${{ matrix.c_compiler == 'emcc' }}"
        working-directory: ${{ steps.strings.outputs.build-output-dir }}
        # Execute tests defined by the CMake configuration. Note that --build-config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
        # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
        run: node weaver_tests.js

  # GitHub-hosted arm64 runners (ubuntu-22.04-arm, windows-11-arm) cover
  # aarch64 natively in the main build matrix above, but there's no 32-bit ARM
  # hosted runner, so armv7hf is still cross-compiled here on an x86 runner
  # and its tests run through QEMU user-mode emulation instead.
  # CMAKE_CROSSCOMPILING_EMULATOR (set explicitly below, since Conan doesn't
  # know about QEMU) makes both `cmake --build` and `ctest` transparently exec
  # test binaries as e.g. `qemu-arm -L /usr/arm-linux-gnueabihf <binary>`.
  build-arm:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:
          - arch: arm
            triple: arm-linux-gnueabihf
            qemu: qemu-arm
            profile: cmake-conan/arm_profile

    steps:
      - uses: actions/checkout@v3

      - name: Install cross-compilation toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user "gcc-12-${{ matrix.triple }}" "g++-12-${{ matrix.triple }}"

      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
          echo "generators-dir=${{ github.workspace }}/build/build/Release/generators" >> "$GITHUB_OUTPUT"

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Install Conan2
        run: pip install conan

      - name: Cache Conan dependencies
        id: conan-cache
        uses: actions/cache@v3
        with:
          path: ~/.conan2
          key: conan2-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('**/conanfile.*') }}
          restore-keys: conan2-${{ runner.os }}-${{ matrix.arch }}-

      - name: Detect default Conan profile
        if: steps.conan-cache.outputs.cache-hit != 'true'
        run: conan profile detect

      - name: Install Conan Dependencies
        run: >
          conan install --build=missing -pr:h ${{ matrix.profile }} -of ${{ steps.strings.outputs.build-output-dir }} ${{ github.workspace }}

      - name: Configure CMake
        run: >
          cmake -S ${{ github.workspace }}
          -B ${{ steps.strings.outputs.build-output-dir }}
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=${{ steps.strings.outputs.generators-dir }}/conan_toolchain.cmake
          -DWEAVER_VECTORIZE=NEON
          -DCMAKE_CROSSCOMPILING_EMULATOR="${{ matrix.qemu }};-L;/usr/${{ matrix.triple }}"

      - name: Build
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config Release

      - name: Test (QEMU)
        working-directory: ${{ steps.strings.outputs.build-output-dir }}
        # Runs transparently under QEMU via CMAKE_CROSSCOMPILING_EMULATOR above.
        run: ctest --build-config Release --output-on-failure
