name: Build and Test Matrix

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        # ubuntu-22.04-arm / windows-11-arm / macos-26 are native GitHub-hosted
        # arm64 runners (Linux/Windows/macOS still report as runner.os
        # Linux/Windows/macOS, so none of the steps below need to branch on
        # architecture).
        os: [ubuntu-latest, windows-latest, ubuntu-22.04-arm, windows-11-arm, macos-26]
        build_type: [Release]
        c_compiler: [gcc-12, clang-18, cl, emcc, clang]
        # One leg per WEAVER_VECTORIZE backend, so every op-codegen change is
        # actually compiled (and, where the runner's CPU allows it, run)
        # against all of ref/SSE/AVX/AVX2/AVX512/NEON: x86 hosts cover
        # ref/SSE/AVX/AVX2/AVX512, arm64 hosts cover ref/NEON (see the
        # vectorize/os excludes below).
        vectorize: ['Generic', 'SSE 4.2', 'AVX', 'AVX 2', 'AVX 512', 'NEON']
        include:
          - os: windows-latest
            c_compiler: cl
          - os: windows-11-arm
            c_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc-12
            cxx_compiler: g++-12
          - os: ubuntu-latest
            c_compiler: clang-18
            cxx_compiler: clang++-18
          - os: ubuntu-22.04-arm
            c_compiler: gcc-12
            cxx_compiler: g++-12
          - os: ubuntu-22.04-arm
            c_compiler: clang-18
            cxx_compiler: clang++-18
          # macOS's Xcode-provided clang isn't a versioned llvm.org build like
          # clang-18, so it gets its own unversioned c_compiler value.
          - os: macos-26
            c_compiler: clang
            cxx_compiler: clang++
        exclude:
          # Compiler/os pairing: cl only on Windows, gcc-12/clang-18 only on
          # x64/arm64 Linux, plain clang only on macOS, and emcc (portable
          # wasm32 output, no ISA dependence) only on the x64 Linux runner
          # rather than duplicated onto every other host too.
          - os: windows-latest
            c_compiler: gcc-12
          - os: windows-latest
            c_compiler: clang-18
          - os: windows-latest
            c_compiler: emcc
          - os: windows-latest
            c_compiler: clang
          - os: windows-11-arm
            c_compiler: gcc-12
          - os: windows-11-arm
            c_compiler: clang-18
          - os: windows-11-arm
            c_compiler: emcc
          - os: windows-11-arm
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl
          - os: ubuntu-latest
            c_compiler: clang
          - os: ubuntu-22.04-arm
            c_compiler: cl
          - os: ubuntu-22.04-arm
            c_compiler: emcc
          - os: ubuntu-22.04-arm
            c_compiler: clang
          - os: macos-26
            c_compiler: gcc-12
          - os: macos-26
            c_compiler: clang-18
          - os: macos-26
            c_compiler: cl
          - os: macos-26
            c_compiler: emcc
          # Vectorize/os pairing: x86 backends only make sense on x86 hosts,
          # NEON only on arm64 hosts.
          - os: ubuntu-latest
            vectorize: 'NEON'
          - os: windows-latest
            vectorize: 'NEON'
          - os: ubuntu-22.04-arm
            vectorize: 'SSE 4.2'
          - os: ubuntu-22.04-arm
            vectorize: 'AVX'
          - os: ubuntu-22.04-arm
            vectorize: 'AVX 2'
          - os: ubuntu-22.04-arm
            vectorize: 'AVX 512'
          - os: windows-11-arm
            vectorize: 'SSE 4.2'
          - os: windows-11-arm
            vectorize: 'AVX'
          - os: windows-11-arm
            vectorize: 'AVX 2'
          - os: windows-11-arm
            vectorize: 'AVX 512'
          - os: macos-26
            vectorize: 'SSE 4.2'
          - os: macos-26
            vectorize: 'AVX'
          - os: macos-26
            vectorize: 'AVX 2'
          - os: macos-26
            vectorize: 'AVX 512'
          # Emscripten's headers only emulate up to SSE 4.2 over wasm32 SIMD128;
          # there is no __m256/__m512 support to target AVX/AVX2/AVX512 with.
          - c_compiler: emcc
            vectorize: 'AVX'
          - c_compiler: emcc
            vectorize: 'AVX 2'
          - c_compiler: emcc
            vectorize: 'AVX 512'

    steps:
      - uses: actions/checkout@v3

      - name: Setup build toolchain configuration
        # Every non-MSVC, non-emcc leg (gcc-12/clang-18/clang) sets cxx_compiler
        # via its include entry above; cl and emcc don't need CC/CXX overridden.
        if: "${{ matrix.cxx_compiler != '' }}"
        run: |
          echo "CC=${{ matrix.c_compiler }}" >> $GITHUB_ENV
          echo "CXX=${{ matrix.cxx_compiler }}" >> $GITHUB_ENV

      - name: Set reusable strings
        # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "generators-dir=${{ github.workspace }}/build/build/generators" >> $GITHUB_OUTPUT
          else
            echo "generators-dir=${{ github.workspace }}/build/build/${{ matrix.build_type }}/generators" >> $GITHUB_OUTPUT
          fi
          if [ "${{ matrix.c_compiler }}" = "emcc" ]; then
            echo "host-profile=-pr:h ${{ github.workspace }}/cmake-conan/emscripten_profile" >> $GITHUB_OUTPUT
          else
            echo "host-profile=" >> $GITHUB_OUTPUT
          fi

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Install Conan2
        run: pip install conan

      - name: Cache Conan dependencies
        id: conan-cache
        uses: actions/cache@v3
        with:
          path: ~/.conan2
          # Keyed on matrix.os rather than runner.os: ubuntu-latest and
          # ubuntu-22.04-arm both report runner.os Linux but build
          # architecture-specific binaries, so runner.os alone would collide
          # x64 and arm64 caches under the same gcc-12/clang-18 compiler name.
          key: conan2-${{ matrix.os }}-${{ matrix.c_compiler }}-${{ hashFiles('**/conanfile.*') }}
          restore-keys: conan2-${{ matrix.os }}-${{ matrix.c_compiler }}-

      - name: Detect default Conan profile
        if: steps.conan-cache.outputs.cache-hit != 'true'
        run: |
          echo Using C compiler: $CC
          echo Using C++ compiler: $CXX
          conan profile detect

      - name: Install Conan Dependencies
        run: >
          conan install --build=missing ${{ steps.strings.outputs.host-profile }} -of ${{ steps.strings.outputs.build-output-dir }} ${{ github.workspace }}

      - name: Configure CMake
        # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
        # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
        run: >
          cmake -S ${{ github.workspace }}
          -B ${{ steps.strings.outputs.build-output-dir }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_TOOLCHAIN_FILE=${{ steps.strings.outputs.generators-dir }}/conan_toolchain.cmake
          -DWEAVER_VECTORIZE="${{ matrix.vectorize }}"

      - name: Build
        # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

      - name: Test (Linux/macOS)
        if: "${{ (runner.os == 'Linux' || runner.os == 'macOS') && matrix.c_compiler != 'emcc' }}"
        working-directory: ${{ steps.strings.outputs.build-output-dir }}
        # Execute tests defined by the CMake configuration. Note that --build-config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
        # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
        #
        # AVX-512 is special-cased: GitHub-hosted runners don't guarantee AVX-512
        # CPU support even though the build above always compiles it (that's what
        # catches cross-backend interface bugs). If this runner's CPU lacks it,
        # skip running rather than fail the job on an unrelated SIGILL. Only
        # reachable on Linux (macOS legs are NEON-only, see the vectorize/os
        # excludes above), so checking /proc/cpuinfo unconditionally is safe.
        run: |
          if [ "${{ matrix.vectorize }}" = "AVX 512" ]; then
            if ! grep -qE '\bavx512f\b' /proc/cpuinfo || ! grep -qE '\bavx512vl\b' /proc/cpuinfo || ! grep -qE '\bavx512dq\b' /proc/cpuinfo; then
              echo "::warning::Skipping AVX-512 tests: this runner's CPU does not support avx512f/avx512vl/avx512dq."
              exit 0
            fi
          fi
          ctest --build-config ${{ matrix.build_type }}

      - name: Test (Windows)
        if: "${{ runner.os == 'Windows' }}"
        working-directory: ${{ steps.strings.outputs.build-output-dir }}
        shell: pwsh
        # Same AVX-512 caveat as the Linux step above, checked via the .NET
        # intrinsics support flag instead of /proc/cpuinfo.
        run: |
          if ("${{ matrix.vectorize }}" -eq "AVX 512") {
            if (-not [System.Runtime.Intrinsics.X86.Avx512F]::IsSupported) {
              Write-Host "::warning::Skipping AVX-512 tests: this runner's CPU does not support AVX-512."
              exit 0
            }
          }
          ctest --build-config ${{ matrix.build_type }}
          exit $LASTEXITCODE

      - name: Test (Emscripten)
        if: "${{ matrix.c_compiler == 'emcc' }}"
        working-directory: ${{ steps.strings.outputs.build-output-dir }}
        # Execute tests defined by the CMake configuration. Note that --build-config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
        # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
        run: node weaver_tests.js

  # GitHub-hosted arm64 runners (ubuntu-22.04-arm, windows-11-arm) cover
  # aarch64 natively in the main build matrix above, but there's no 32-bit ARM
  # hosted runner, so armv7hf is still cross-compiled here on an x86 runner
  # and its tests run through QEMU user-mode emulation instead.
  # CMAKE_CROSSCOMPILING_EMULATOR (set explicitly below, since Conan doesn't
  # know about QEMU) makes both `cmake --build` and `ctest` transparently exec
  # test binaries as e.g. `qemu-arm -L /usr/arm-linux-gnueabihf <binary>`.
  build-arm:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:
          - arch: arm
            triple: arm-linux-gnueabihf
            qemu: qemu-arm
            profile: cmake-conan/arm_profile

    steps:
      - uses: actions/checkout@v3

      - name: Install cross-compilation toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user "gcc-12-${{ matrix.triple }}" "g++-12-${{ matrix.triple }}"

      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
          echo "generators-dir=${{ github.workspace }}/build/build/Release/generators" >> "$GITHUB_OUTPUT"

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Install Conan2
        run: pip install conan

      - name: Cache Conan dependencies
        id: conan-cache
        uses: actions/cache@v3
        with:
          path: ~/.conan2
          key: conan2-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('**/conanfile.*') }}
          restore-keys: conan2-${{ runner.os }}-${{ matrix.arch }}-

      - name: Detect default Conan profile
        if: steps.conan-cache.outputs.cache-hit != 'true'
        run: conan profile detect

      - name: Install Conan Dependencies
        run: >
          conan install --build=missing -pr:h ${{ matrix.profile }} -of ${{ steps.strings.outputs.build-output-dir }} ${{ github.workspace }}

      - name: Configure CMake
        run: >
          cmake -S ${{ github.workspace }}
          -B ${{ steps.strings.outputs.build-output-dir }}
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=${{ steps.strings.outputs.generators-dir }}/conan_toolchain.cmake
          -DWEAVER_VECTORIZE=NEON
          -DCMAKE_CROSSCOMPILING_EMULATOR="${{ matrix.qemu }};-L;/usr/${{ matrix.triple }}"

      - name: Build
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config Release

      - name: Test (QEMU)
        working-directory: ${{ steps.strings.outputs.build-output-dir }}
        # Runs transparently under QEMU via CMAKE_CROSSCOMPILING_EMULATOR above.
        run: ctest --build-config Release --output-on-failure
